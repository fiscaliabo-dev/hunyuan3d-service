<!DOCTYPE html>
<html>
<head>
    <title>Hunyuan3D-2.1</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; text-align: center; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        #status { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Hunyuan3D-2.1</h1>
    <input type="file" id="f" accept="image/*">
    <button onclick="gen()">Generar 3D</button>
    <div id="status"></div>
    <script>
        async function gen() {
            const f = document.getElementById('f').files[0];
            if (!f) return;
            const d = new FormData();
            d.append('file', f);
            document.getElementById('status').textContent = 'Generando...';
            const r = await fetch('/generate-3d/', { method:'POST', body:d });
            if (r.ok) {
                const b = await r.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = 'modelo.glb';
                a.click();
                document.getElementById('status').textContent = '✅ Listo';
            } else {
                document.getElementById('status').textContent = '❌ Error';
            }
        }
    </script>
</body>
</html>
