name: Build TripoSR
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - run: docker build --no-cache -t fiscaliabo/triposr:v3 .
      - run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u fiscaliabo --password-stdin
      - run: docker push fiscaliabo/triposr:v3
