name: Build Hunyuan3D
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t fiscaliabo/hunyuan3d:latest .
      
      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u fiscaliabo --password-stdin
          docker push fiscaliabo/hunyuan3d:latest
