name: Build Hunyuan3D
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker image
        run: docker build -t fiscaliabo/hunyuan3d:latest .
      
      - name: Push to Docker Hub
        run: |
          echo "Iniciando sesión en Docker Hub..."
          echo $DOCKER_TOKEN | docker login -u fiscaliabo --password-stdin
          echo "Subiendo imagen..."
          docker push fiscaliabo/hunyuan3d:latest
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
