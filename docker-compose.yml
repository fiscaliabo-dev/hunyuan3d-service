version: '3.8'

services:
  hunyuan3d:
    image: fiscaliabo/hunyuan3d-2.1:latest
    container_name: hunyuan3d
    ports:
      - "8002:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s